<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#11110f">
  <title>Grain</title>
  <meta name="description" content="用底片色彩，記錄眼前的一刻。">
  <meta property="og:title" content="Grain">
  <meta property="og:description" content="用底片色彩，記錄眼前的一刻。">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://waltwait.github.io/Grain/icon-512.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <span class="wordmark">GRAIN</span>
    <div class="frame" aria-hidden="true"><span class="grain-dot"></span></div>
    <p class="eyebrow">FOR ANDROID</p>
    <h1>留住光，<br>也留住顆粒。</h1>
    <p class="intro">用底片色彩，記錄眼前的一刻。</p>
    <section class="release" aria-label="最新版本">
      <p id="version">正在取得最新版…</p>
      <p id="notes"></p>
      <a id="download" hidden>下載 APK <span aria-hidden="true">↗</span></a>
      <p id="status" role="status"></p>
      <button id="retry" type="button" hidden>重新載入</button>
    </section>
    <footer>Grain · Android 10+ · <a href="https://github.com/waltwait/Grain/releases">所有版本</a> · <a href="https://github.com/waltwait/Grain">GitHub</a></footer>
  </main>
</body>
</html>
