name: Grain download page

on:
  push:
    branches: [main]
    paths:
      - website/**
      - updates/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: grain-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare download page
        run: |
          mkdir -p _site/release
          cp website/index.html website/style.css website/app.js _site/
          cp updates/personal-fuji/latest.json _site/latest.json
          cp updates/release/latest.json _site/release/latest.json
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
