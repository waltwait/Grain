name: Android checks
on:
  pull_request:
  push:
    branches: [main]
    paths: ['app/**', 'tools/**', 'scripts/**', '.claude/**', '.github/workflows/android-ci.yml', '*.gradle.kts', 'gradle/**', 'gradle.properties']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: grain-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Install Grain SDK packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0"'
      - name: Verify release scripts
        run: python3 -m unittest discover -s scripts -p 'test_ci_*.py'
      - name: Compile and run JVM checks
        run: bash tools/gradle.sh --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebugAndroidTest
      - name: Test and lint reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: grain-check-reports
          path: |
            app/build/test-results/testDebugUnitTest/*.xml
            app/build/reports/lint-results-debug.*
          retention-days: 7
          if-no-files-found: ignore
